name: Temporary Security Dependency Refresh

on:
  push:
    branches:
      - security/codex-node-24-22-next-16-4-3
    paths:
      - .github/workflows/security-lockfile-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up patched Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up locked pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.24.0
          install: false

      - name: Regenerate workspace lockfile and apply reviewed patch
        run: pnpm install --no-frozen-lockfile

      - name: Verify framework and runtime versions
        run: |
          node -e '
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          assert.equal(process.versions.node, "24.22.1");
          for(const app of ["web","url-safety-scanner","media-sanitizer"]){
            const pkg = JSON.parse(fs.readFileSync("apps/" + app + "/package.json", "utf8"));
            assert.equal(pkg.dependencies.next, "16.4.3");
            assert.equal(pkg.devDependencies["eslint-config-next"], "16.4.3");
            console.log(app, pkg.dependencies.next);
          }
          '

      - name: Verify patched Next ESLint behavior
        run: pnpm test:tooling

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Commit only generated lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile update needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): refresh pnpm lockfile for patched Next.js"
          git push origin HEAD:security/codex-node-24-22-next-16-4-3
