<!doctype html>
<html lang="en">
  <body>
    <h2>Confirm your Spall Spill account</h2>

    <p>
      Follow the link below to confirm your email address and finish
      creating your Spall Spill account.
    </p>

    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
      >
        Confirm email address
      </a>
    </p>

    <p>
      If you did not request this account, you can ignore this email.
    </p>
  </body>
</html>
